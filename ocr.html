<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paraibuna | OCR Umidade</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head><body><p>Serviço OCR Paraibuna. Abra pelo aplicativo.</p>
<script>
'use strict';
const ORIGEM_APP=/^https:\/\/(?:script\.google\.com|script\.googleusercontent\.com)(?::443)?$/;
let worker=null,ocupado=false;
async function obterWorker(){
  if(!worker){
    worker=await Tesseract.createWorker('eng',1);
    await worker.setParameters({tessedit_char_whitelist:'0123456789,.%',tessedit_pageseg_mode:'7',preserve_interword_spaces:'0'});
  }
  return worker;
}
function valorDoTexto(txt){
  const limpo=String(txt||'').replace(/\s+/g,'').replace(/[oO]/g,'0');
  const m=limpo.match(/(?:\d{1,2}[.,]\d{1,2}|\d{1,2})(?=%|$)/);
  if(!m)return null;
  const n=Number(m[0].replace(',','.'));
  return Number.isFinite(n)&&n>=0&&n<=60?n:null;
}
function preparar(img,modo){
  const c=document.createElement('canvas');c.width=1500;c.height=620;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  // Tenta foto completa e regiões centrais, sem recortar o visor à força.
  const regioes=[[0,0,1,1],[.08,.10,.84,.80],[.20,.22,.60,.56]];
  const r=regioes[Math.floor(modo/3)];
  ctx.drawImage(img,img.naturalWidth*r[0],img.naturalHeight*r[1],img.naturalWidth*r[2],img.naturalHeight*r[3],0,0,c.width,c.height);
  const pix=ctx.getImageData(0,0,c.width,c.height),d=pix.data;
  const variante=modo%3;
  for(let i=0;i<d.length;i+=4){
    const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    let v=variante===0?Math.max(0,Math.min(255,(g-125)*1.8+125)):
      variante===1?(g>135?255:0):(g<135?255:0);
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(pix,0,0);return c;
}
function carregar(src){return new Promise((ok,fail)=>{
 const img=new Image();img.onload=()=>ok(img);img.onerror=fail;img.src=src;
});}
async function reconhecer(src){
 const img=await carregar(src),w=await obterWorker(), resultados=[];
 for(let modo=0;modo<9;modo++){
   const {data}=await w.recognize(preparar(img,modo));
   const valor=valorDoTexto(data.text);
   if(valor!==null && (data.confidence||0)>=20)resultados.push({valor,confianca:data.confidence||0});
 }
 const grupos=[];
 for(const x of resultados){
   let g=grupos.find(g=>Math.abs(g.valor-x.valor)<.11);
   if(!g){g={valor:x.valor,votos:0,confianca:0};grupos.push(g);}
   g.votos++;g.confianca+=x.confianca;
 }
 grupos.sort((a,b)=>b.votos-a.votos||b.confianca-a.confianca);
 // Múltiplas concordâncias reduzem falsos positivos, mas ainda exigem confirmação humana.
 return grupos[0]?.votos>=2?Math.round(grupos[0].valor*10)/10:null;
}
window.addEventListener('message',async ev=>{
  if(!ORIGEM_APP.test(ev.origin))return;
  const d=ev.data;
  if(d?.tipo!=='PARAIBUNA_OCR_PEDIDO'||!Number.isSafeInteger(d.id)||typeof d.imagem!=='string'||!d.imagem.startsWith('data:image/'))return;
  if(ocupado){ev.source?.postMessage({tipo:'PARAIBUNA_OCR_RESPOSTA',id:d.id,valor:null},ev.origin);return;}
  ocupado=true;
  let valor=null;
  try{valor=await reconhecer(d.imagem);}catch(e){console.error('OCR',e);}
  finally{ocupado=false;}
  ev.source?.postMessage({tipo:'PARAIBUNA_OCR_RESPOSTA',id:d.id,valor},ev.origin);
});
window.parent?.postMessage({tipo:'PARAIBUNA_OCR_PRONTO'},'*');
</script></body></html>
